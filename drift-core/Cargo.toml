[package]
name = "drift-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Drift video editor - FFmpeg operations with C API"

[lib]
name = "drift_core"
crate-type = ["staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
cbindgen = "0.27"
